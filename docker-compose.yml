services:
  db:
    image: postgres:16-alpine
    container_name: township-db
    environment:
      POSTGRES_DB: township
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - township-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d township"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  township-pgdata:
