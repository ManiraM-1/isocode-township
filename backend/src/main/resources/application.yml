spring:
  application:
    name: township
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/township}
    username: ${DATABASE_USERNAME:township}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  demo-mode: ${APP_DEMO_MODE:false}
  otp:
    ttl: 5m
    max-attempts: 5
    max-requests-per-window: 3
    request-window: 10m
  payments:
    max-amount-above-outstanding: 100000.00
  jwt:
    secret: ${JWT_SECRET}
    ttl: 12h
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
    timeout: 6s
  safety:
    terms:
      - fire
      - smoke
      - burning smell
      - gas
      - gas leak
      - lpg
      - cylinder
      - lift stuck
      - stuck in lift
      - stuck in the lift
      - trapped
      - shock
      - electric shock
      - current
      - spark*
      - short circuit
      - electrocut*
      - aag
      - dhuan
      - dhuaan
      - current lag*
      - jhatka
      - lift mein phas*
      - lift me phas*
      - lift band ho*
      - आग*
      - धुआं*
      - धुआँ*
      - गैस*
      - सिलेंडर*
      - लिफ्ट में फंस*
      - लिफ्ट में फँस*
      - फंस*
      - फँस*
      - करंट*
      - झटका*
      - शॉर्ट सर्किट
      - चिंगारी
      - धूर*
      - गॅस*
      - सिलिंडर*
      - लिफ्टमध्ये अडक*
      - अडक*
      - शॉक*
      - ठिणगी*
      - जळण्याचा वास

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never
